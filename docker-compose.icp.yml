# THE ICP HALF OF THE TOPOLOGY, under compose like everything else.
#
# `docker compose -f docker-compose.yml -f docker-compose.icp.yml up -d icp-replica`
#
# WHY A SEPARATE FILE rather than a service in docker-compose.yml: the same reason
# the web and grc-desk files are separate. Compose interpolates every variable in
# every -f file BEFORE it selects a service, so a required variable in one file
# makes every service in the set unstartable -- measured on this project earlier.
# This file introduces no required variable, but it also has no business being
# started by someone who only wants the harness.
services:
  icp-replica:
    build:
      context: .
      dockerfile: docker/icp-replica.Dockerfile
    image: swap-terminal/icp-replica:local
    container_name: swap-icp-replica
    pull_policy: build

    # READ-ONLY on the source, and that is the point rather than caution. The
    # replica needs to SEE icp/ to build a canister from it; it has no reason to
    # write there, and a container that can rewrite the repository is one whose
    # output nobody can attribute.
    volumes:
      # ONE DIRECTORY, READ-WRITE, and both halves of that were learned the hard
      # way on 2026-10-06. The history is kept because each wrong version looked
      # more careful than the one that works.
      #
      # ATTEMPT 1 -- ./dfx.json, ./Cargo.toml and ./Cargo.lock mounted as
      # individual FILES, because dfx.json was at the repository root and the root
      # cannot be mounted wholesale (it holds the Python tree and a Solana
      # keypair). A single-file bind mount follows the INODE, and `git pull` does
      # not edit a file in place -- it writes a new one and renames it over the
      # old. Measured after a pull that added the ledger canister:
      #
      #   container  /repo/dfx.json  inode 40898326  259 bytes  grep -c icp_ledger_canister -> 0
      #   host       ./dfx.json      inode 40898329  704 bytes  grep -c icp_ledger_canister -> 1
      #
      # The container had been reading a dfx.json that no longer existed on disk,
      # and the only symptom was `dfx deploy` saying the canister was "not found
      # in dfx.json" about a file that declares it. Nothing crashed, and it would
      # have recurred on every pull. tests/test_docker_build_context.py's
      # single-file-mount gate is what stops attempt 1 coming back.
      #
      # ATTEMPT 2 -- `./icp:/repo:ro` plus named volumes at /repo/target and
      # /repo/.dfx, with a comment claiming "Docker layers mounts, so these two
      # paths are writable while everything else under /repo is not." THAT WAS
      # FALSE, and the container would not start at all:
      #
      #   error mounting ".../swap_terminal_icp-dfx/_data" to rootfs at
      #   "/repo/.dfx": create mountpoint for /repo/.dfx mount: make mountpoint
      #   "/repo/.dfx": mkdirat .../merged/repo/.dfx: read-only file system
      #
      # Docker has to CREATE the mountpoint, and neither directory exists in
      # ./icp, so creating it means writing into a read-only rootfs. Layering a
      # volume over a path that already exists works; conjuring one inside :ro
      # does not.
      #
      # SO: READ-WRITE, which is what dfx actually requires. It writes .dfx/ (the
      # canister ids) and target/ (the build) into its PROJECT directory and has
      # no option to put either anywhere else -- there is no DFX_PROJECT_STATE_DIR
      # to set. Fighting that with volumes is what broke attempt 2.
      #
      # The ":ro is the point rather than caution" line that used to be here is
      # retracted: it was a claim about attribution, and what it bought in
      # practice was two outages. What replaces it is narrower and checkable --
      # the container can write exactly two paths in this tree, `target/` and
      # `.dfx/`, and BOTH are gitignored at every depth, so `git status` in a
      # checkout stays clean and tests/test_no_key_material_is_tracked.py fails if
      # either is ever committed. Writing to the host also means the build cache
      # and the canister ids survive `compose down` without a volume at all, which
      # is what the volumes were for.
      - "./icp:/repo"

      # IDENTITIES STAY OUT OF THE REPOSITORY TREE, and this is the one mount that
      # is not about convenience. DFX_CONFIG_ROOT=/state (see the Dockerfile) is
      # where dfx keeps identity keys, including the plaintext local `minter`. A
      # read-write project mount plus identities inside it would put key material
      # under a path somebody could `git add -f`. /state is a named volume outside
      # /repo precisely so that cannot happen.
      - "icp-state:/state"

      # THE REPLICA'S ACTUAL STATE, AND ITS ABSENCE IS WHY TWO INCIDENTS LOOKED
      # LIKE SURPRISES. Measured inside the running container 2026-10-07:
      #
      #     /state                    40K    .config only  <- the volume above
      #     /root/.local/share/dfx    180M   network/local/<hash>/state
      #     /repo/.dfx                2.3M   canister ids and wasm copies
      #
      # DFX_CONFIG_ROOT=/state moves dfx's CONFIG and not its DATA, so for as long
      # as this file has existed the volume persisted forty kilobytes of config
      # while the canisters lived on the container's writable layer. 8455339 (a
      # `down` destroyed the ledger and its 1000 LICP) and 1373fa3 (the threshold
      # key changed across one recreation) are the same defect seen twice.
      #
      # THE WHOLE DATA DIRECTORY AND NOT network/local, because the <hash> under it
      # is derived from the network configuration -- change the config and dfx uses
      # a different directory. Mounting the parent means the state follows the
      # config rather than being orphaned beside it.
      #
      # THE FIRST `up` AFTER THIS LANDS STARTS FROM AN EMPTY VOLUME, so the ledger
      # and threshold_custody must be deployed once more (icp_ledger_init.py, then
      # `dfx deploy`). After that they persist, and the proof is 1373fa3's own
      # test: public_key on the same canister id, `down`, `up`, same hex.
      - "icp-replica-data:/root/.local/share/dfx"

    ports:
      # 4943 is dfx's own default, kept so that every command in every tutorial
      # works unchanged from the host.
      - "127.0.0.1:4943:4943"

    # NOT "unless-stopped". Measured on this project 2026-10-05: unless-stopped
    # restart-loops a crash exactly like always does, so a misconfigured replica
    # comes back forever instead of staying visibly down. A local replica is
    # started for a session of work and stopped after.
    restart: "no"

    healthcheck:
      # The replica answering its own status endpoint, which is the artifact --
      # not the process being up, which proves nothing (rule 13).
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:4943/api/v2/status"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s

volumes:
  icp-state:
  # Named rather than bind-mounted: a bind would put 180M of replica state under
  # the operator's checkout, where `git status` would have to ignore it and a
  # `git clean -xdf` would silently destroy the ledger.
  icp-replica-data:
