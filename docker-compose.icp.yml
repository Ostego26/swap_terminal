# THE ICP HALF OF THE TOPOLOGY, under compose like everything else.
#
# `docker compose -f docker-compose.yml -f docker-compose.icp.yml up -d icp-replica`
#
# WHY A SEPARATE FILE rather than a service in docker-compose.yml: the same reason
# the web and grc-desk files are separate. Compose interpolates every variable in
# every -f file BEFORE it selects a service, so a required variable in one file
# makes every service in the set unstartable -- measured on this project earlier.
# This file introduces no required variable, but it also has no business being
# started by someone who only wants the harness.
services:
  icp-replica:
    build:
      context: .
      dockerfile: docker/icp-replica.Dockerfile
    image: swap-terminal/icp-replica:local
    container_name: swap-icp-replica
    pull_policy: build

    # READ-ONLY on the source, and that is the point rather than caution. The
    # replica needs to SEE icp/ to build a canister from it; it has no reason to
    # write there, and a container that can rewrite the repository is one whose
    # output nobody can attribute.
    volumes:
      - "./icp:/repo/icp:ro"
      - "./dfx.json:/repo/dfx.json:ro"

      # THE WORKSPACE MANIFEST AND ITS LOCK, and they are mounted because dfx
      # cannot build without them: its Rust builder runs `cargo locate-project`
      # from the directory holding dfx.json -- /repo -- and `locate-project`
      # walks parents only. The first deploy in this container died exactly
      # there ("could not find `Cargo.toml` in `/repo` or any parent
      # directory"), with the canister already created, which is the shape rule
      # 13 warns about: a step that got far enough to look like it worked.
      - "./Cargo.toml:/repo/Cargo.toml:ro"

      # :ro ON THE LOCK IS DELIBERATE AND IS A CHECK, not caution. The lock is
      # complete, so a build that resolves cleanly never writes it; a build that
      # WANTS to write it is telling you the container resolved different
      # versions than the host did, and failing on "Read-only file system"
      # reports that out loud instead of producing a canister built from
      # dependencies no committed file names.
      - "./Cargo.lock:/repo/Cargo.lock:ro"

      # BUILD OUTPUT AND PROJECT STATE IN NAMED VOLUMES, for two different
      # reasons, neither of which is speed alone.
      #
      # target/: a workspace puts it at the workspace root, which is the mounted
      # /repo. Without a volume here it lands in the container's own layer and
      # every `compose up` after a `down` pays a full cold rebuild of candid and
      # ic-cdk -- 24.3s measured on the host for this one small canister, and
      # this is the first of several.
      #
      # .dfx/: canister ids live in .dfx/<network>/canister_ids.json while the
      # replica's own state lives under /state. Those two have to survive
      # together or they disagree: a recreated container would hold a replica
      # that still hosts bkyz2-fmaaa-aaaaa-qaaaq-cai beside a project that has
      # forgotten the name, and `dfx deploy` would create a SECOND canister
      # rather than upgrade the one holding the key.
      - "icp-target:/repo/target"
      - "icp-dfx:/repo/.dfx"
      - "icp-state:/state"

    ports:
      # 4943 is dfx's own default, kept so that every command in every tutorial
      # works unchanged from the host.
      - "127.0.0.1:4943:4943"

    # NOT "unless-stopped". Measured on this project 2026-10-05: unless-stopped
    # restart-loops a crash exactly like always does, so a misconfigured replica
    # comes back forever instead of staying visibly down. A local replica is
    # started for a session of work and stopped after.
    restart: "no"

    healthcheck:
      # The replica answering its own status endpoint, which is the artifact --
      # not the process being up, which proves nothing (rule 13).
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:4943/api/v2/status"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s

volumes:
  icp-state:
  icp-target:
  icp-dfx:
