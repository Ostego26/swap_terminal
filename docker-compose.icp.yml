# THE ICP HALF OF THE TOPOLOGY, under compose like everything else.
#
# `docker compose -f docker-compose.yml -f docker-compose.icp.yml up -d icp-replica`
#
# WHY A SEPARATE FILE rather than a service in docker-compose.yml: the same reason
# the web and grc-desk files are separate. Compose interpolates every variable in
# every -f file BEFORE it selects a service, so a required variable in one file
# makes every service in the set unstartable -- measured on this project earlier.
# This file introduces no required variable, but it also has no business being
# started by someone who only wants the harness.
services:
  icp-replica:
    build:
      context: .
      dockerfile: docker/icp-replica.Dockerfile
    image: swap-terminal/icp-replica:local
    container_name: swap-icp-replica
    pull_policy: build

    # READ-ONLY on the source, and that is the point rather than caution. The
    # replica needs to SEE icp/ to build a canister from it; it has no reason to
    # write there, and a container that can rewrite the repository is one whose
    # output nobody can attribute.
    volumes:
      # ONE DIRECTORY, NOT FOUR FILES, and that is the whole fix for a defect
      # measured on the live host 2026-10-06. This block used to mount ./icp plus
      # ./dfx.json, ./Cargo.toml and ./Cargo.lock individually, because dfx.json
      # was at the repository root and the root cannot be mounted wholesale -- it
      # holds the Python tree and a Solana keypair.
      #
      # A SINGLE-FILE BIND MOUNT FOLLOWS THE INODE. `git pull` does not edit a
      # file in place; it writes a new one and renames it over the old, so the
      # inode changes and the mount keeps showing the file that was there when the
      # container started. Measured after a pull that added the ledger canister:
      #
      #   container  /repo/dfx.json  inode 40898326  259 bytes  grep -c icp_ledger_canister -> 0
      #   host       ./dfx.json      inode 40898329  704 bytes  grep -c icp_ledger_canister -> 1
      #
      # The only symptom was `dfx deploy icp_ledger_canister` reporting "Canister
      # 'icp_ledger_canister' not found in dfx.json" about a file that declares
      # it. Nothing crashed and nothing warned, and it would have recurred on
      # every pull -- rule 13, and rule 13's own answer: verify the artifact, not
      # the deploy. A directory mount resolves names on each access and cannot go
      # stale this way.
      #
      # READ-ONLY on the source, and that is the point rather than caution. The
      # replica needs to SEE the project to build a canister from it; it has no
      # reason to write there, and a container that can rewrite the repository is
      # one whose output nobody can attribute.
      - "./icp:/repo:ro"

      # BUILD OUTPUT AND PROJECT STATE IN NAMED VOLUMES, mounted INSIDE the
      # read-only bind above -- Docker layers mounts, so these two paths are
      # writable while everything else under /repo is not.
      #
      # target/: the workspace root is /repo, so cargo puts it there. Without a
      # volume it lands in the container's own layer and every `compose up` after
      # a `down` pays a full cold rebuild of candid and ic-cdk -- 59.6s measured
      # in the container for this one small canister, and it is the first of
      # several.
      #
      # .dfx/: canister ids live in .dfx/<network>/canister_ids.json while the
      # replica's own state lives under /state. Those two have to survive together
      # or they disagree: a recreated container would hold a replica that still
      # hosts bkyz2-fmaaa-aaaaa-qaaaq-cai beside a project that has forgotten the
      # name, and `dfx deploy` would create a SECOND canister rather than upgrade
      # the one holding the key.
      - "icp-target:/repo/target"
      - "icp-dfx:/repo/.dfx"
      - "icp-state:/state"

    ports:
      # 4943 is dfx's own default, kept so that every command in every tutorial
      # works unchanged from the host.
      - "127.0.0.1:4943:4943"

    # NOT "unless-stopped". Measured on this project 2026-10-05: unless-stopped
    # restart-loops a crash exactly like always does, so a misconfigured replica
    # comes back forever instead of staying visibly down. A local replica is
    # started for a session of work and stopped after.
    restart: "no"

    healthcheck:
      # The replica answering its own status endpoint, which is the artifact --
      # not the process being up, which proves nothing (rule 13).
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:4943/api/v2/status"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s

volumes:
  icp-state:
  icp-target:
  icp-dfx:
