# THE CARGO WORKSPACE FOR THE CANISTERS. It sits at the repository root because
# dfx puts it there, not because this is a Rust project -- the terminal is Python
# and SQL and stays that way.
#
# Role: build manifest (no code of its own)
# Reads: icp/<canister>/Cargo.toml for every member listed below
# Writes: ./target, ./Cargo.lock
# Can move funds: no
# Mainnet-safe: yes
#
# WHY IT IS HERE AND NOT UNDER icp/, MEASURED RATHER THAN GUESSED. dfx's Rust
# builder shells out to `cargo locate-project` from the directory that contains
# dfx.json, and `locate-project` walks PARENTS only -- it never descends. With
# dfx.json at the root and the only manifest two levels down, the first deploy
# inside the replica container died at:
#
#   Caused by: The pre-build all step failed
#   Caused by: 'cargo locate-project' failed: error: could not find `Cargo.toml`
#             in `/repo` or any parent directory
#
# Moving dfx.json down to icp/ would fix that and break the thing rule 10 asks
# for: dfx.json is what an operator runs `dfx deploy` against, so it is an entry
# point and belongs at the root where it is found by looking. So the manifest
# comes up to meet it.
#
# MEMBERS ARE LISTED EXPLICITLY, not globbed as "icp/*". A glob would make a new
# canister arrive in the build the moment somebody created a directory, and the
# set of things that hold threshold keys is exactly the set that should cost a
# deliberate line in a tracked file.
[workspace]
members = ["icp/threshold_custody"]
resolver = "2"

# THE RELEASE PROFILE LIVES HERE AND NOWHERE ELSE, and that is forced rather than
# chosen. Cargo ignores `[profile.*]` in a workspace MEMBER and only warns about
# it ("profiles for the non root package will be ignored"), so leaving these
# three lines in icp/threshold_custody/Cargo.toml -- where they were written, and
# where they worked while that crate was standalone -- would have silently
# reverted the canister to the default release profile the moment this file
# landed. Measured across exactly that change: 376425 bytes before, and the same
# 376425 after, because the settings were moved in the same commit that created
# the workspace. A canister pays for its own size in cycles at install time and
# lives inside a module-size limit, which is why the profile is tuned at all.
[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
