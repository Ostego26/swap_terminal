# The Flask UI and the three supervised workers. ONE container, ONE required variable.
#
# Role: file (operator entry point at the repository root per CLAUDE.md rule 10)
# Reads: the process environment
# Writes: nothing itself; the service writes swap_terminal.db and runtime state
# Can move funds: YES -- payout_worker is one of the processes it starts. Nothing
#       in this file arms it: no SOL_PAYOUT_KEYPAIR_PATH, no XRP_PAYOUT_SECRET_SEED,
#       no ST_ADAPTOR_FUNDING_SEED, no wallet passphrase. Arming is live posture
#       and the operator's decision (rule 16).
# Live-safe: NO. Read the SWAP_DB_DIR comment below before mounting a database
#       that holds real swaps, and stop the host's workers first -- see the
#       banner immediately below.
#
# ONE REQUIRED VARIABLE PER FILE. THAT IS THE RULE THIS FILE EXISTS TO OBEY, and
# it was learned twice.
#
# 2026-10-05, first attempt: all four services were in docker-compose.yml, so the
# `${VAR:?}` guards on web and grc-desk made `docker compose up -d abstergo`
# fail. Fixed by moving both out.
#
# 2026-10-05, SAME DAY, same defect one level in: web and grc-desk were moved into
# ONE file, so `docker compose -f docker-compose.yml -f docker-compose.stateful.yml
# up -d web` demanded GRC_DESK_DATADIR -- a variable that has nothing to do with
# the web service. Measured on the operator's host: the command printed only
# GRC_DESK_DATADIR errors, started nothing, and `curl` answered HTTP 000.
#
# `docker compose` interpolates EVERY variable in EVERY file it is given, before
# it looks at which service was named. So a file may contain at most one service
# with a required variable, or a service with a required variable must be alone
# in its file. Splitting "the stateful ones" as a group was still grouping by the
# wrong thing: the grouping that matters is which variables a command will be
# forced to supply.
#
# BEFORE YOU START THIS, STOP THE HOST'S WORKERS. `supervisor.py status` on the
# operator's host read `running=3/3` while this file was being written, and
# starting this service on top of that gives TWO deposit watchers, TWO payout
# workers and TWO reconcilers against one SQLite file. gunicorn.conf.py's closing
# section records what that costs: two payout workers paid the same swap twice --
# 2 sends, 1 swap. Compose cannot check that for you; it is the one precondition
# this file can only state.
#
#     python3 swap_terminal/supervisor.py stop     # on the HOST, first
#     docker compose -f docker-compose.yml -f docker-compose.web.yml up -d web

services:
  # ---------------------------------------------------------------------------
  # INCREMENT 4 -- gunicorn AND the three workers. THE DATABASE INCREMENT.
  #
  # READ THIS BEFORE MOUNTING A DATABASE YOU CARE ABOUT.
  #
  # swap_terminal.db is WAL-mode SQLite, and WAL depends on shared-memory mapping
  # that does not work correctly on every filesystem. On FUSE, virtiofs, NFS or
  # an SMB share, the -shm file either fails or silently stops providing the
  # locking WAL assumes -- and the failure mode is corruption, not an error.
  # Docker Desktop on macOS and Windows mounts host paths over virtiofs/gRPC-FUSE,
  # so this service is NOT safe there with a host bind mount, however well it
  # appears to work.
  #
  # The check is one command on the host, against the directory you intend to
  # mount, and it is NOT optional:
  #
  #     stat -f -c '%T  %n' <the directory holding swap_terminal.db>
  #
  # ext2/ext3, ext4, xfs, btrfs or zfs on a native Linux host: proceed.
  # fuseblk, virtiofs, nfs, smb2 or 9p: STOP. Use a named docker volume instead,
  # and accept that the root tools on the host can then no longer open the same
  # file -- which is a real cost, not a detail, because show_late_deposits.py and
  # the other 33 tools are how an operator sees anything.
  #
  # AND THE SECOND HAZARD, which containers do not cause and do not fix (§5):
  # `busy_timeout` appears ZERO times in any .py in this repository, against five
  # concurrent writers. SQLite's default busy timeout is 0, so a writer that finds
  # the lock held raises SQLITE_BUSY immediately rather than waiting. That is the
  # one database change that would actually help, and it is named as work rather
  # than done here.
  # ---------------------------------------------------------------------------
  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
    image: swap-terminal/web:local
    container_name: swap-web
    pull_policy: build

    # 127.0.0.1 ON THE HOST SIDE, AND THE CONTAINER SIDE CANNOT BE LOOPBACK.
    # gunicorn.conf.py defaults its bind to 127.0.0.1, which inside a container
    # means the CONTAINER's loopback -- unreachable from the host, so the service
    # would start, log cleanly, and answer nothing. SWAP_TERMINAL_HOST below is
    # therefore 0.0.0.0, and the 127.0.0.1 in this publish line is what keeps it
    # off-box rather than the bind address.
    #
    # THAT HAS A CONSEQUENCE THE OPERATOR MUST DECIDE (design doc §6.2, decision
    # 4): kill_switch.refuse_off_box() reads the bind from /proc and REFUSES on a
    # 0.0.0.0 bind. Inside a container that refusal is a false positive -- the
    # publish is loopback-only -- but it is a refusal, and the controls stay
    # refused until somebody changes refuse_off_box() to understand a namespace.
    # That change is not made here: it would weaken a guard on the order path to
    # suit a deployment, which is backwards.
    ports:
      - "127.0.0.1:${SWAP_TERMINAL_HOST_PORT:-5100}:5000"

    # 127.0.0.1 INSIDE A CONTAINER IS THE CONTAINER, AND THAT IS WHY THE UI CAME
    # UP EMPTY. Measured on the operator's host 2026-10-05: GET / answered HTTP
    # 200 and the swap selector had nothing in it. The page was fine; it had
    # nothing to offer, because services/pair_view.offerable_pairs() is "allowed,
    # AND BOTH CHAINS REACHABLE" and no chain was reachable. The BTC, LTC and GRC
    # daemons run on the HOST, so a container asking 127.0.0.1:18443 asks itself.
    #
    # host-gateway resolves host.docker.internal to the address of the host from
    # inside the container. It is the portable spelling: `network_mode: host` would
    # also work and throws away the network namespace along with the 127.0.0.1
    # publish guard, and hardcoding 172.17.0.1 assumes the default bridge subnet
    # that any `docker network create` can change.
    #
    # SO THE RPC HOSTS MUST BE host.docker.internal, NOT 127.0.0.1. The variables
    # below are pass-throughs, so that is the operator's shell to set -- and it is
    # the one difference between the host deployment's environment and this one:
    #
    #     BTC_RPC_HOST=host.docker.internal LTC_RPC_HOST=host.docker.internal \
    #     GRC_RPC_HOST=host.docker.internal
    #
    # An unreachable chain is not an error here and must not become one: config.py
    # builds no adapter for an unconfigured chain and the UI lists the pair as
    # unavailable, which is the correct failure for a missing endpoint.
    extra_hosts:
      - "host.docker.internal:host-gateway"

    environment:
      # EXPLICIT, NEVER THE DEFAULT. config.py falls back to a path under its own
      # BASE_DIR (§3.2), which inside the image is the image -- a database that
      # looks like it works and is discarded by `docker compose down`.
      SWAP_DB_PATH: /data/swap_terminal.db
      ST_WORKER_RUN_DIR: /runtime
      SWAP_TERMINAL_HOST: "0.0.0.0"
      SWAP_TERMINAL_PORT: "5000"
      # 2, matching gunicorn.conf.py's own default. Its closing section records why
      # it is not 4: two payout workers paid the same swap twice, 2 sends for 1
      # swap. The bottleneck here is SQLite's single writer lock, not CPU.
      GUNICORN_WORKERS: "${GUNICORN_WORKERS:-2}"
      ST_WORKER_GRACE_SECONDS: "${ST_WORKER_GRACE_SECONDS:-15}"

      # EVERY NAME HERE IS MEASURED AGAINST config.py, NOT REMEMBERED, and the
      # first draft of this block got three of them wrong in a way that killed
      # three chains silently.
      #
      # It passed BTC_RPC_PASSWORD, LTC_RPC_PASSWORD and GRC_RPC_PASSWORD.
      # config.py reads *_RPC_PASS. Measured on the operator's host 2026-10-05,
      # from the server's own /api/health with all three daemons REACHABLE on the
      # host namespace:
      #
      #     BTC  {'adapter_built': False, 'missing_settings': ['BTC_RPC_PASS']}
      #     GRC  {'adapter_built': False, 'missing_settings': ['GRC_RPC_PASS']}
      #     LTC  {'adapter_built': False, 'missing_settings': ['LTC_RPC_PASS']}
      #     SOL  {'adapter_built': True,  'missing_settings': []}
      #     XRP  {'adapter_built': True,  'missing_settings': []}
      #
      # So the UI showed "0 of 20 directions can be quoted right now" with every
      # chain reachable and every credential exported in the shell. A misspelled
      # pass-through is indistinguishable from an unconfigured chain, because the
      # value arrives empty either way.
      #
      # THIS IS THE THIRD TIME IN ONE DAY. swap_terminal/gridcoin_credentials.py
      # exists because ONE Gridcoin password is read under four spellings, and its
      # docstring predicts the symptom exactly: "an HTTP 401 that reads as 'the
      # wallet is broken' rather than 'you spelled the variable differently over
      # here'". I used a fifth spelling in an acceptance block this morning, and
      # then this block repeated the mistake for BTC and LTC as well.
      # tests/test_compose_chain_variables.py now holds the whole family against
      # config.py so a fourth time fails the suite instead of the UI.
      #
      # *_RPC_WALLET WAS MISSING ENTIRELY, and that one is not cosmetic. The host
      # deployment runs BTC and LTC against wallet=desk_hot; without it the
      # adapter talks to the daemon's DEFAULT wallet, so a deposit scan would
      # watch the wrong wallet and a payout would spend from it. An unconfigured
      # chain fails loudly; a chain configured against the wrong wallet does not.
      BTC_RPC_HOST: "${BTC_RPC_HOST:-}"
      BTC_RPC_PORT: "${BTC_RPC_PORT:-}"
      BTC_RPC_USER: "${BTC_RPC_USER:-}"
      BTC_RPC_PASS: "${BTC_RPC_PASS:-}"
      BTC_RPC_WALLET: "${BTC_RPC_WALLET:-}"
      BTC_RPC_TIMEOUT: "${BTC_RPC_TIMEOUT:-}"
      LTC_RPC_HOST: "${LTC_RPC_HOST:-}"
      LTC_RPC_PORT: "${LTC_RPC_PORT:-}"
      LTC_RPC_USER: "${LTC_RPC_USER:-}"
      LTC_RPC_PASS: "${LTC_RPC_PASS:-}"
      LTC_RPC_WALLET: "${LTC_RPC_WALLET:-}"
      LTC_RPC_TIMEOUT: "${LTC_RPC_TIMEOUT:-}"
      # 25779 IS THE DESK. config.py:31 documents it as the terminal's Gridcoin
      # port, so the code expects the desk daemon rather than the customer's on
      # 25715. Unset means UNCONFIGURED_PORT and the GRC pair reports unavailable,
      # which is the right failure for a missing endpoint rather than a guess at
      # one. The operator's environment still says 25715 as of 2026-10-05; that is
      # the pending role switch, not something this file should decide.
      GRC_RPC_HOST: "${GRC_RPC_HOST:-}"
      GRC_RPC_PORT: "${GRC_RPC_PORT:-}"
      GRC_RPC_USER: "${GRC_RPC_USER:-}"
      GRC_RPC_PASS: "${GRC_RPC_PASS:-}"
      GRC_RPC_WALLET: "${GRC_RPC_WALLET:-}"
      GRC_RPC_TIMEOUT: "${GRC_RPC_TIMEOUT:-}"
      SOL_HOT_WALLET: "${SOL_HOT_WALLET:-}"
      SOL_RPC_COMMITMENT: "${SOL_RPC_COMMITMENT:-}"
      SOL_RPC_TIMEOUT: "${SOL_RPC_TIMEOUT:-}"
      XRP_RPC_TIMEOUT: "${XRP_RPC_TIMEOUT:-}"

      # NINETEEN MORE, MEASURED 2026-10-05 AND NOT ONE OF THEM GUESSED. The first
      # version of this block covered the *_RPC_* family and stopped there, and
      # the gate written to hold it used the pattern `_RPC_|_HOT_WALLET` -- so
      # BOTH the file and its test missed the same nineteen variables, which is
      # rule 8's shape: a check derived from the same wrong idea as the thing it
      # checks agrees with it.
      #
      # The list below is every remaining name config.py reads through _env(),
      # generated from the source rather than typed. config.py reads NO signing
      # material -- SOL_PAYOUT_KEYPAIR_PATH, XRP_PAYOUT_SECRET_SEED,
      # GRIDCOIN_WALLET_PASSPHRASE and ST_ADAPTOR_FUNDING_SEED all live in
      # services/ -- so "pass everything config.py reads" is both complete and
      # arms nothing. That is the invariant the gate now holds.
      #
      # deposit accounts -- WHY SOL AND XRP READ UNAVAILABLE AS A SOURCE.
      SOL_DEPOSIT_ACCOUNT: "${SOL_DEPOSIT_ACCOUNT:-}"  # config.py default: ""
      XRP_DEPOSIT_ACCOUNT: "${XRP_DEPOSIT_ACCOUNT:-}"  # config.py default: ""
      SOL_SPL_MINT: "${SOL_SPL_MINT:-}"  # config.py default: ""
      #
      # network fee reserves -- the `cannot_quote` condition.
      BTC_NETWORK_FEE_RESERVE: "${BTC_NETWORK_FEE_RESERVE:-}"  # config.py default: "0.0000282"
      GRC_NETWORK_FEE_RESERVE: "${GRC_NETWORK_FEE_RESERVE:-}"  # config.py default: "0.001"
      LTC_NETWORK_FEE_RESERVE: "${LTC_NETWORK_FEE_RESERVE:-}"  # config.py default: "0.001"
      SOL_NETWORK_FEE_RESERVE: "${SOL_NETWORK_FEE_RESERVE:-}"  # config.py default: "0.000005"
      XRP_NETWORK_FEE_RESERVE: "${XRP_NETWORK_FEE_RESERVE:-}"  # config.py default: "0.00001"
      #
      # confirmation thresholds -- a SAFETY setting, not a tuning knob.
      BTC_MIN_CONFIRMATIONS: "${BTC_MIN_CONFIRMATIONS:-}"  # config.py default: "2"
      GRC_MIN_CONFIRMATIONS: "${GRC_MIN_CONFIRMATIONS:-}"  # config.py default: "6"
      LTC_MIN_CONFIRMATIONS: "${LTC_MIN_CONFIRMATIONS:-}"  # config.py default: "2"
      SOL_MIN_CONFIRMATIONS: "${SOL_MIN_CONFIRMATIONS:-}"  # config.py default: "3"
      XRP_MIN_CONFIRMATIONS: "${XRP_MIN_CONFIRMATIONS:-}"  # config.py default: "1"
      #
      # pricing and risk -- these decide what a customer is quoted.
      DEFAULT_FEE_BPS: "${DEFAULT_FEE_BPS:-}"  # config.py default: "150"
      AMOUNT_TOLERANCE_PCT: "${AMOUNT_TOLERANCE_PCT:-}"  # config.py default: "0.01"
      QUOTE_TTL_SECONDS: "${QUOTE_TTL_SECONDS:-}"  # config.py default: "600"
      RATE_CACHE_SECONDS: "${RATE_CACHE_SECONDS:-}"  # config.py default: "30"
      SMALL_SWAP_MANUAL_REVIEW_USD: "${SMALL_SWAP_MANUAL_REVIEW_USD:-}"  # config.py default: "5000"
      #
      # the Flask session key.
      SECRET_KEY: "${SECRET_KEY:-}"  # config.py default: "swap-terminal-dev"
      SOL_RPC_URL: "${SOL_RPC_URL:-}"
      XRP_RPC_URL: "${XRP_RPC_URL:-}"

      # ICP. The adapter has no port and no URL: it reaches the ledger by running
      # dfx in the icp-replica compose service -- chains/icp.py records the
      # measurement that rules out every Python candid/agent library on this
      # machine. These four are passed for the reason this whole block exists: a
      # variable config.py reads and this file does not pass arrives UNSET inside
      # the container, so the container runs on a different setting than the host
      # with nothing reporting the difference.
      #
      # The first two default to "" in config.py, so an unset pair means NO ICP
      # adapter is built rather than one aimed at the mainnet ledger.
      ICP_LEDGER_CANISTER_ID: "${ICP_LEDGER_CANISTER_ID:-}"
      ICP_OWNER_PRINCIPAL: "${ICP_OWNER_PRINCIPAL:-}"
      ICP_DFX_SERVICE: "${ICP_DFX_SERVICE:-}"          # config.py default: "icp-replica"
      ICP_CALL_TIMEOUT: "${ICP_CALL_TIMEOUT:-}"        # config.py default: "60"
      # The destination-side reserve, needed the moment any *->ICP pair is enabled.
      # Passed now rather than then, for this block's standing reason: a variable
      # config.py reads and this file omits arrives UNSET in the container, so the
      # container quotes at a different reserve than the host with nothing reporting
      # the difference. config.py's default is the ledger's published icrc1_fee.
      ICP_NETWORK_FEE_RESERVE: "${ICP_NETWORK_FEE_RESERVE:-}"   # config.py default: "0.0001"

      # SIGNING MATERIAL IS ABSENT, ALL OF IT. SOL_PAYOUT_KEYPAIR_PATH,
      # ST_ADAPTOR_FUNDING_SEED and every wallet passphrase. Unset, this container
      # serves and watches and reconciles and cannot send. Arming it is live
      # posture and the operator's call (rule 16); no line in this file arms it,
      # and the keypair mount the design doc describes is deliberately not written
      # out, because a commented-out mount is a thing somebody uncomments.

    volumes:
      # swap_terminal.db AND ITS -wal AND -shm SIDECARS ARE ONE UNIT and must be
      # ONE mount. Mounting the .db file alone leaves WAL writing its sidecars
      # into the image, where they are discarded -- and a WAL database separated
      # from its WAL is a database missing its most recent committed writes.
      # So this mounts the DIRECTORY, never the file.
      - "${SWAP_DB_DIR:?set SWAP_DB_DIR to the directory holding swap_terminal.db, after running the stat -f check in the comment above}:/data"
      # pid files, worker logs and kill_switch.lock. On the writable layer these
      # die with the container, and a pid file that cannot outlive the process it
      # names can never prove a stop across a restart (rule 13).
      - "${ST_RUNTIME_DIR:-./runtime/web}:/runtime"

    # on-failure:5 FOR THE SAME REASON abstergo's is on-failure:3 -- see that
    # comment. `unless-stopped` was measured restart-looping a container that
    # cannot start, so a web container missing SWAP_DB_PATH or an RPC credential
    # would flap instead of showing as exited with the reason in its logs. Five
    # rather than three because this one starts four processes and has more ways
    # to lose a race on a slow host, and because a payout worker that genuinely
    # died is worth a couple of extra attempts.
    #
    # IF YOU WANT THIS BACK AFTER A HOST REBOOT, that is `restart: always` and it
    # is a deliberate choice, not a default -- it means a container that signs
    # payouts comes up without anyone asking. Left as the operator's (rule 16).
    restart: on-failure:5

    # 45s, which must EXCEED ST_WORKER_GRACE_SECONDS (15) plus the gunicorn grace
    # (20) with room to spare. The entrypoint stops the three workers FIRST and
    # proves their absence through /proc before gunicorn is asked to go; a grace
    # period shorter than that sequence SIGKILLs the entrypoint mid-proof, and the
    # container then exits reporting success having proven nothing.
    stop_grace_period: 45s
