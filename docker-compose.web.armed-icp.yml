# ARMING ICP. Add this file and the container can SIGN AND BROADCAST ICP payouts.
#
# Role: file (operator entry point at the repository root per CLAUDE.md rule 10)
# Reads: the process environment
# Writes: nothing itself
# Can move funds: THIS FILE IS WHAT MAKES IT ABLE TO, for ICP and nothing else.
# Live-safe: NO. That is the entire point of it being a separate file.
#
# WHY THIS FILE DID NOT EXIST UNTIL 2026-10-11, which is the interesting part.
#
# It was not an omission from a plan. chains/icp.py carried `can_spend = False`
# HARDCODED from the day ICP landed (2026-10-06), with a comment saying a payout
# "must be signed by the desk's own dfx identity, and this process has none".
# That was true of the transport it was given and false about what was possible:
# dfx_transport() grew an `identity` parameter the NEXT DAY, 2026-10-07, for the
# minting-account top-up, and chains/registry.py went on calling it with three
# arguments. ICPAdapter.send_to_address() has been fully implemented the whole
# time. So the capability existed, the declaration said it did not, and nothing
# could notice -- because a hardcoded False cannot go stale.
#
# The operator said so on 2026-10-11: "why is this hardcoded to not pay out. it
# shouldn't." They were the third operator instruction of this exact shape -- XRP
# derived can_spend from 2026-10-02, SOL only after "whoa we have to be able to
# swap TO SOL too" on 2026-10-03, ICP today.
#
# NO ${VAR:?} AT ALL, AND THAT IS THE CORRECTION THIS FILE EXISTS IN ITS SECOND
# FORM TO MAKE.
#
# The first version, shipped 2026-10-11 and wrong within the hour, demanded
# ICP_IDENTITY_PEM_HOST_FILE and mounted it as a bind -- mirroring
# docker-compose.web.armed-sol.yml without checking that the two cases are not
# alike. SOL's keypair genuinely IS a host file: the operator makes it with
# `solana-keygen new -o <path>` and it sits in their home directory. ICP's
# identity is not. It is created by dfx INSIDE the replica container, under
# DFX_CONFIG_ROOT=/state, which docker-compose.icp.yml backs with the `icp-state`
# named volume. Measured on the operator's host 2026-10-11:
#
#     docker compose exec -T icp-replica sh -c 'ls "$DFX_CONFIG_ROOT/.config/dfx/identity/"'
#     default
#     minter
#
# Both on the volume, created 2026-10-06. THERE IS NO HOST PATH TO GIVE, so the
# variable the first version demanded could not be filled in -- and filling it in
# would have meant copying a signing key out of a volume onto the host, which is
# the one thing chain-safety forbids outright.
#
# SO THE VOLUME IS MOUNTED INSTEAD AND NOTHING IS COPIED. The credential never
# leaves the compose project, never touches the host filesystem, and never appears
# on a screen. That also removes the operator variable entirely: the volume name
# and the identity name are both fixed by the project, so NAMING THIS FILE IS THE
# WHOLE ACT. tests/test_docker_build_context.py requires "AT MOST ONE" required
# variable per file, so zero is allowed, and arming is still an act taken on the
# command line and visible in shell history.
#
# READ-ONLY, AND THAT IS THE ONE THING NOT MEASURED -- see the block at the foot of
# this file. A writable mount would give a process holding wallet RPC credentials
# write access to the desk's identity store, which is the wrong direction to be
# wrong in, so `:ro` is the default and the fallback is stated rather than guessed.
#
# WHICH IDENTITY IT MUST BE IS NOT A FREE CHOICE. The ledger's `transfer` debits
# the CALLER, and every ICP deposit address this terminal hands out is a
# SUBACCOUNT OF ICP_OWNER_PRINCIPAL. So the PEM has to be the one whose principal
# IS ICP_OWNER_PRINCIPAL -- on a local replica, the replica container's own
# default identity, which is where that principal was read from in the first
# place. Any other PEM arms the adapter, reaches the ledger, and has no coins.
#
# ICP_DFX_NETWORK_URL IS NOT SET HERE AND DOES NOT NEED SETTING ANYWHERE, which this
# block claimed the opposite of for an hour. docker-compose.web.yml:387 already carries
#
#     ICP_DFX_NETWORK_URL: "${ICP_DFX_NETWORK_URL:-http://icp-replica:4943}"
#
# so the url transport is already the default. It IS the transport the web container
# must use -- docker/web.Dockerfile's runtime stage installs no docker CLI and no
# compose file mounts the daemon socket, so the compose transport cannot run there at
# all, and mounting the socket would hand a process holding wallet RPC credentials
# control of the whole Docker daemon. Set the variable only if the replica is somewhere
# other than the compose network.
#
# NEITHER THIS FILE NOR THE OTHER THREE ARMS ANY CHAIN BUT ITS OWN. Arming is a
# posture and a posture should take an act to enter; naming this file on the
# command line is that act, and it is visible in shell history and in
# `docker compose config`.
#
#     docker compose -f docker-compose.yml \
#                    -f docker-compose.web.armed-icp.yml up -d web
#
# EVERY `-f` FOR A FILE docker-compose.yml NOW INCLUDES IS GONE FROM THAT COMMAND.
# Since 2026-10-10 it declares `include:` for docker-compose.icp.yml and
# docker-compose.web.yml, so both arrive with it, and naming one again would hand
# compose the same file twice.
#
# TWO THINGS ARE NOT ESTABLISHED AND BOTH ARE NAMED RATHER THAN LEFT TO BE FOUND
# (rule 17: say which you have).
#
# FIRST, WHETHER dfx TOLERATES A READ-ONLY DFX_CONFIG_ROOT -- MEASURED 2026-10-11 AND
# IT DOES. This block said it could not be run, because dfx is not installed in the
# environment the file was written in. The operator ran it on their host:
#
#     docker compose -f docker-compose.yml -f docker-compose.web.armed-icp.yml \
#             run --rm --entrypoint sh web -c 'dfx identity list'
#     anonymous
#     default *
#     minter
#
# So `web`'s dfx read the replica's identity store through the read-only mount and
# found both identities, with `default` already current. The `:ro` stands, and the
# fallback this block used to describe -- dropping `:ro`, widening what a process
# holding wallet RPC credentials can do to the desk's identity store -- is not needed.
#
# WHAT THAT COMMAND DID NOT ESTABLISH, and the distinction is the whole of rule 17:
# `identity list` is a READ. The payout does `canister call --network <url>
# --identity default`, which is a different command and could still want to write
# something -- a wallet canister record, a networks file. That is now a much smaller
# gap than it was, and it closes the first time a transfer is attempted, which is the
# second item below.
#
# SECOND, AND THIS BLOCK SAID SOMETHING FALSE UNTIL 2026-10-11. It read "NO ICP PAYOUT
# HAS EVER BEEN SIGNED OR BROADCAST BY THIS CODE, on any network", and I wrote that, and
# chains/icp.py's own header records the opposite four lines from its top:
#
#     send 0.25 ICP     block index 1
#     after             desk 999.7499    subaccount 1 0.25
#     after             desk 999.7499    subaccount 1 0.25      unchanged
#
# A 0.25 ICP transfer through ICPAdapter.send_to_address() on the local replica,
# 2026-10-06, with the block index returned and a same-key retry answering TxDuplicate
# against an unchanged balance. config.py:812 and config.py:1015 cite the same run. I
# read the `can_spend = False` comment lower in that file and took it for the whole
# story without reading the header above it -- the wrong-comment bug committed by a
# reader rather than a writer, and rule 17's failure exactly: a hypothesis written in
# the register of a measurement.
#
# THE NARROWER CLAIM IS THE TRUE ONE AND IT IS STILL OUTSTANDING. That run reached the
# ledger through the COMPOSE transport, where an empty identity means the replica
# container's own default. What has never run is the URL transport with an explicit
# --identity, which is what this overlay arms -- and separately, no payout has ever
# completed through services/payout_service.py for ICP at all, because
# broadcast_payout() calls send_to_address(address, amount) with two positional
# arguments, so created_at_time arrives as None and the adapter refuses before any
# ledger call. Measured 2026-10-11 through the real process_pending_payouts():
# zero ledger calls, swaps.status failed, the deposit already credited.
#
# SO ARMING THIS OVERLAY TODAY MAKES FIVE `* -> ICP` DIRECTIONS OFFERABLE AGAINST A
# PAYOUT PATH THAT REFUSES EVERY TIME. It is a refusal rather than a double-pay --
# nothing is sent, so nothing is sent twice -- but a customer's deposit is taken and
# credited first. Until payout_service passes the swap's recorded created_at, the
# honest posture is not to arm this, and `configure_env.py --arm icp` is reversible by
# removing this file from COMPOSE_FILE and recreating the container.
services:
  web:
    volumes:
      # THE REPLICA'S OWN dfx CONFIG, READ-ONLY. `icp-state` is declared by
      # docker-compose.icp.yml, which docker-compose.yml `include:`s, so it arrives
      # with the project and is the SAME volume the replica has at /state -- not a
      # copy of it. That is what makes the desk's identity reachable from `web`
      # without any signing material being moved, copied or read.
      - "icp-state:/icp-dfx-config:ro"
    environment:
      # dfx looks for identities under $DFX_CONFIG_ROOT/.config/dfx/identity/<name>,
      # so pointing it at the mount above is what makes `--identity default` resolve
      # to the replica's own default identity -- the one whose principal IS
      # ICP_OWNER_PRINCIPAL, which is where that value was read from in the first
      # place. Any other identity arms the adapter, reaches the ledger, and has no
      # coins.
      DFX_CONFIG_ROOT: /icp-dfx-config
      # The name dfx resolves, fixed by the project rather than supplied. `minter`
      # is deliberately NOT used: it signs mints from the ledger's minting account,
      # which is fund_desk.py's business and not a customer payout.
      ICP_PAYOUT_IDENTITY: default
