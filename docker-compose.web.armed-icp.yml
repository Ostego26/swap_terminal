# ARMING ICP. Add this file and the container can SIGN AND BROADCAST ICP payouts.
#
# Role: file (operator entry point at the repository root per CLAUDE.md rule 10)
# Reads: the process environment
# Writes: nothing itself
# Can move funds: THIS FILE IS WHAT MAKES IT ABLE TO, for ICP and nothing else.
# Live-safe: NO. That is the entire point of it being a separate file.
#
# WHY THIS FILE DID NOT EXIST UNTIL 2026-10-11, which is the interesting part.
#
# It was not an omission from a plan. chains/icp.py carried `can_spend = False`
# HARDCODED from the day ICP landed (2026-10-06), with a comment saying a payout
# "must be signed by the desk's own dfx identity, and this process has none".
# That was true of the transport it was given and false about what was possible:
# dfx_transport() grew an `identity` parameter the NEXT DAY, 2026-10-07, for the
# minting-account top-up, and chains/registry.py went on calling it with three
# arguments. ICPAdapter.send_to_address() has been fully implemented the whole
# time. So the capability existed, the declaration said it did not, and nothing
# could notice -- because a hardcoded False cannot go stale.
#
# The operator said so on 2026-10-11: "why is this hardcoded to not pay out. it
# shouldn't." They were the third operator instruction of this exact shape -- XRP
# derived can_spend from 2026-10-02, SOL only after "whoa we have to be able to
# swap TO SOL too" on 2026-10-03, ICP today.
#
# ONE ${VAR:?} AND IT IS THE PEM, which is the rule
# tests/test_docker_build_context.py enforces and the reason is quoted from
# docker-compose.web.armed-sol.yml: "compose interpolates EVERY variable in EVERY
# file it is given before it looks at which service was named, so two required
# variables in one file mean you must supply BOTH to use EITHER."
#
# SO THE IDENTITY NAME IS A LITERAL HERE AND NOT A SECOND VARIABLE. dfx resolves
# `--identity <name>` against ~/.config/dfx/identity/<name>/identity.pem, so the
# mount PATH is what decides the name -- mounting to .../desk/identity.pem makes
# the name `desk`, and ICP_PAYOUT_IDENTITY below says so. The operator supplies
# one thing: where their PEM is. Making the name a variable too would mean two
# values that must agree, which is rule 8's shape and buys nothing.
#
# WHICH IDENTITY IT MUST BE IS NOT A FREE CHOICE. The ledger's `transfer` debits
# the CALLER, and every ICP deposit address this terminal hands out is a
# SUBACCOUNT OF ICP_OWNER_PRINCIPAL. So the PEM has to be the one whose principal
# IS ICP_OWNER_PRINCIPAL -- on a local replica, the replica container's own
# default identity, which is where that principal was read from in the first
# place. Any other PEM arms the adapter, reaches the ledger, and has no coins.
#
# ICP_DFX_NETWORK_URL IS STILL REQUIRED AND IS DELIBERATELY NOT SET HERE, because
# it is not key material and not a custody decision -- it belongs in .env with the
# rest of the configuration. Without it the web container uses the compose
# transport, and docker/web.Dockerfile's runtime stage installs no docker CLI and
# no compose file mounts the daemon socket, so that transport cannot run there at
# all. Mounting the socket would fix it and must not be done: it hands a process
# holding wallet RPC credentials control of the whole Docker daemon.
#
#     ICP_DFX_NETWORK_URL=http://icp-replica:4943
#
# NEITHER THIS FILE NOR THE OTHER THREE ARMS ANY CHAIN BUT ITS OWN. Arming is a
# posture and a posture should take an act to enter; naming this file on the
# command line is that act, and it is visible in shell history and in
# `docker compose config`.
#
#     docker compose -f docker-compose.yml \
#                    -f docker-compose.web.armed-icp.yml up -d web
#
# EVERY `-f` FOR A FILE docker-compose.yml NOW INCLUDES IS GONE FROM THAT COMMAND.
# Since 2026-10-10 it declares `include:` for docker-compose.icp.yml and
# docker-compose.web.yml, so both arrive with it, and naming one again would hand
# compose the same file twice.
#
# AND HERE IS THE PART THAT IS NOT ESTABLISHED (rule 17: say which you have). NO
# ICP PAYOUT HAS EVER BEEN SIGNED OR BROADCAST BY THIS CODE, on any network. The
# arming path is new today, the derivation is unit-tested, and what has NOT
# happened is a transfer leaving the desk's account on the local replica and a
# block index coming back. That is the proof this repository asks for and it is
# outstanding. The first run of it belongs on the local replica, where ICP is
# play money, and it is the operator's to make.
services:
  web:
    volumes:
      - "${ICP_IDENTITY_PEM_HOST_FILE:?set ICP_IDENTITY_PEM_HOST_FILE to the dfx identity PEM whose principal IS ICP_OWNER_PRINCIPAL -- on a local replica that is the replica container's own default identity. It is mounted READ-ONLY and its contents are never read, printed or copied by anything in this repository}:/home/swap/.config/dfx/identity/desk/identity.pem:ro"
    environment:
      # The name dfx resolves, fixed by the mount path above rather than supplied.
      ICP_PAYOUT_IDENTITY: desk
