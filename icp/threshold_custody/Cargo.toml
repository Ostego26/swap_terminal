[package]
name = "threshold_custody"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
ic-cdk = "0.17"
candid = "0.10"
# A DIRECT DEPENDENCY even though candid re-exports Deserialize: the derive macro
# expands to `serde::` paths, so the crate must be nameable at the call site.
serde = { version = "1", features = ["derive"] }

# NO `[profile.release]` HERE. It used to be, and it worked while this crate was
# standalone; the workspace manifest at the repository root took it over because
# Cargo IGNORES a profile declared in a workspace member and only warns. The
# settings and the measurement live at ../../Cargo.toml -- this comment exists so
# a reader who comes looking for opt-level in the crate that needs it is sent to
# the one place it can take effect (rule 8: the difference belongs at both sites).
