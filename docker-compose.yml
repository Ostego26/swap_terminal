# Containers for swap_terminal. THE WHOLE TERMINAL, from a bare `docker compose up`.
#
# Role: file (operator entry point at the repository root per CLAUDE.md rule 10 --
#       this is what an operator, a launcher or a cron entry names)
# Reads: the process environment of the shell that runs `docker compose`
# Writes: nothing itself; `abstergo` writes swap_intents.json on its volume and
#       `harness` writes regtest datadirs on its own
# Can move funds: the `abstergo` service can, indirectly -- see its volume note
# Live-safe: no secret is written here. Every CREDENTIAL and every ENDPOINT is
#       `${NAME:-}` with no default, so an unset variable is an empty value the
#       server refuses at startup rather than a working default nobody chose.
#       Exactly two variables carry a default and neither is a credential:
#       REQUIRE_GRIDCOIN_SHARED_SECRET=true (the fail-closed value) and
#       GRIDCOIN_MIN_CONFIRMATIONS=6, which agrees with BOTH places that already
#       state it -- server.js:88 and config.py:153's GRC_MIN_CONFIRMATIONS.
#
# TWO SERVICES HERE, AND THE SPLIT IS A DEFECT FIX RATHER THAN ORGANIZATION.
# `docker compose` interpolates the WHOLE file -- every variable in every file it
# is given -- before it looks at which service you named, so a `${VAR:?reason}`
# on one service's volume made every service in the file unstartable. Measured on
# the operator's host 2026-10-05: `docker compose up -d abstergo` printed only
# GRC_DESK_DATADIR and SWAP_DB_DIR errors and started nothing.
#
# IN THIS FILE -- no required variable, and BOTH ARE NOW BEHIND A PROFILE, so
# neither starts by default (see the `profiles:` comment on each):
#
#   abstergo   (increment 1) the Express swap-intent server. No SQLite, no
#                  PID-namespace requirement, and NO REAPER AT ALL before this
#                  file existed.
#   harness    (increment 2) regtest bitcoind + litecoind AND the harness that
#                  reaps them, in ONE container because stop_daemon() proves
#                  absence with os.kill(pid, 0) on a pid from the daemon's own
#                  pid file.
#
# ONE FILE EACH -- every service carrying a volume path nobody may default:
#
#   web        (increment 4) docker-compose.web.yml, INCLUDED below. gunicorn AND
#                  the three supervised workers, in ONE container because
#                  supervisor.unaccounted_workers() walks /proc. Touches
#                  swap_terminal.db.
#   grc-desk   (increment 3) docker-compose.grc-desk.yml, NOT included. The desk's
#                  Gridcoin daemon. Built from source, never built or run anywhere
#                  yet, and NOT owed work.
#
#     docker compose up -d web
#
# THIS PARAGRAPH SAID `docker-compose.stateful.yml` UNTIL 2026-10-08, AT ALL THREE
# PLACES ABOVE, AND THAT FILE HAS NEVER EXISTED SINCE THE DAY IT WAS NAMED. The
# drift is recorded rather than overwritten because it is the exact failure rule 16
# describes -- "a future reader trusts that sentence" -- and because the line it
# broke was a PASTEABLE COMMAND. An operator following the old line 42 typed
#
#     docker compose -f docker-compose.yml -f docker-compose.stateful.yml up -d web
#
# and got `no such file or directory` from docker, for the one service this header
# exists to tell them how to start.
#
# WHAT ACTUALLY HAPPENED, and it is the same lesson twice in one day: the first
# split (2026-10-05) moved web and grc-desk out of this file together, into
# docker-compose.stateful.yml. Grouping them as "the stateful ones" was still
# grouping by the wrong thing -- `-f docker-compose.yml -f docker-compose.stateful.yml
# up -d web` then demanded GRC_DESK_DATADIR, a variable with nothing to do with the
# web service. So the SECOND split, the same day, gave each one its own file. The
# rule that came out of it is stated at docker-compose.web.yml:14-33 and
# docker-compose.grc-desk.yml:18-26, which is where it is correct: a file may
# contain at most one service with a required variable.
#
# Those two files recorded the correction; this one did not, which is how a header
# describing a superseded layout survived three days in the file an operator reads
# FIRST. Measured 2026-10-08 by listing the tree: eight docker-compose*.yml files
# exist and not one of them is named stateful.
#
# `docker compose up` WITH NO SERVICE NAMED starts every service in the files given
# that is not behind a profile. As of 2026-10-10 that set is exactly `web` and
# `icp-replica` -- the terminal -- because this file includes their two files and
# puts a profile on the two services that are not part of it. The paragraph that
# used to sit here said "nothing prevents that -- compose has no 'require an
# explicit name' switch", which was true of the service list and is the wrong lever:
# `profiles:` is the switch, applied to the services that must be opted into rather
# than to the operator's habit of naming one.
#
# IT STILL STARTS A SERVICE THAT CAN SIGN PAYOUTS. `web` runs payout_worker, and
# whether that worker can broadcast depends only on what its environment arms --
# docker-compose.web.yml passes no signing material, so unset means it serves and
# cannot send. A bare `up` is not a safe-by-default command, it is a
# correct-by-default one, and those are different claims.
#
# NOT CONTAINERIZED, so nobody reads this file as the whole topology:
#   operator-panel  stays on the host (design doc S6), a recommendation rather
#                   than an omission: it already has a reaper and already refuses
#                   to start a second run.
#   the 34 root .py tools  they are things an operator RUNS, not services, several
#                   of them move funds, and they need the database on a host path.
#                   They are deliberately absent from the web image too.
#   grc-testnet-sync (S2) is not a separate service here. It was only ever S1
#                   before it had synced, and the host daemon has already synced.


# ===========================================================================
# THE DEFAULT PROJECT IS THE TERMINAL. Added 2026-10-10 at the operator's
# instruction: "make `docker compose up` and `docker compose down` cover this
# terminal's whole container lifecycle instead of three -f flags."
#
# WHAT IT WAS, measured on this checkout before the change:
#
#     8 docker-compose*.yml files      0 declared `include:`
#                                      0 declared `profiles:`
#     a bare `docker compose up`       read THIS FILE ALONE and started
#                                      `abstergo` + `harness` -- the Node bridge
#                                      and the REGTEST HARNESS, on a host holding
#                                      funded testnet wallets
#     the real set                     assembled in swap_stack.py as
#                                      ("docker-compose.yml",
#                                       "docker-compose.icp.yml",
#                                       "docker-compose.web.yml")
#
# So the terminal was reachable only through a tool that knew the three names, and
# the literal command an operator types reached the two services that are NOT the
# terminal. `include:` moves that knowledge into the file compose reads first.
#
# WHY `include:` AND NOT A `COMPOSE_FILE` ENTRY IN `.env`. Both would make a bare
# `up` read all three. `COMPOSE_FILE` lives in a file this repository must never
# read or write (CLAUDE.md's chain-safety rules: never read back `.env`), it is
# invisible to anyone reading the compose files, and it is per-checkout state
# rather than a declaration in the tree. `include:` is in version control, is read
# by the same parser, and is what the suite can gate.
#
# WHAT IS DELIBERATELY NOT INCLUDED, and this is the load-bearing half:
#
#   docker-compose.web.armed-grc.yml   each one ARMS a chain: it mounts or passes
#   docker-compose.web.armed-sol.yml   the key that lets the container sign and
#   docker-compose.web.armed-xrp.yml   broadcast. Arming is a posture, not a
#                                      setting, and entering it must take an act
#                                      (rule 16). Naming the file on the command
#                                      line IS that act, and it is visible in
#                                      shell history. An `include:` would make the
#                                      act disappear.
#   docker-compose.web.hostnet.yml     replaces the container's whole network mode.
#                                      An alternative, not an addition.
#   docker-compose.grc-desk.yml        requires GRC_DESK_DATADIR, and a default
#                                      there would be a compose file choosing which
#                                      wallet to open. Including it would make that
#                                      variable required to start ANYTHING.
#
# None of those four is referenced by this file, no secret of theirs is named here,
# and tests/test_compose_default_project.py walks `include:` transitively and fails
# if any of them is ever reachable from it.
#
# ---------------------------------------------------------------------------
# HAZARD 1 -- `docker compose down` REMOVES CONTAINERS, AND THIS FILE JUST MADE
# THAT VERB EASIER TO REACH. READ THIS BEFORE TYPING IT.
# ---------------------------------------------------------------------------
# The replica's canister state has been destroyed twice on the operator's host by
# a container being replaced: 2026-10-07 (`down` took the ICP ledger and 1000
# LICP) and 2026-10-08 (an image rebuild recreated the container and took the
# ledger, threshold_custody and operator_admin, ~998.9498 LICP). And the tECDSA
# key is worse than the canisters, because it is silent: measured 2026-10-07, the
# SAME canister id with the SAME `dfx_test_key` produced two different public keys
# across one ordinary recreation, so an address derived from it stops existing
# without anything failing.
#
# WHAT CHANGED SINCE THOSE MEASUREMENTS, and it is why this is a hazard rather
# than a refusal: 28de99c (2026-10-07 20:38 UTC) added
# `icp-replica-data:/root/.local/share/dfx` to docker-compose.icp.yml, a NAMED
# volume over the directory an inspection inside the running container measured at
# 180M holding `network/local/<hash>/state`. Both destructive measurements above
# were taken on containers whose dfx state was on the WRITABLE LAYER, which a
# named volume is not. `docker compose down` without `-v` removes containers and
# keeps named volumes.
#
# WHAT IS THEREFORE STILL NOT ESTABLISHED, stated as the hypothesis it is
# (rule 17): whether the tECDSA key material for `dfx_test_key` lives under
# /root/.local/share/dfx -- now on the volume -- or somewhere else inside the
# container. NO replica is reachable from the container these lines were written
# in, so this was not measured, and the 2026-10-07 key measurement cannot answer
# it because it predates the volume by four hours and forty minutes (15:58 UTC
# against 20:38 UTC, both on 2026-10-07). A reason to believe the
# key now survives is not the same as having checked.
#
# SO: `docker compose stop` IS THE VERB THIS REPOSITORY RECOMMENDS, and
# `swap_stack.py down` deliberately runs `stop` rather than `down` for exactly
# this reason (see its cmd_down comment, and docker/icp_replica_entrypoint.py,
# which exists because `stop`-and-restart then left dfx unable to start). `down`
# answers a question nobody asked -- "is the container gone" -- where the question
# an operator means is "is anything of this stack running".
#
# MEASURED 2026-10-10 BY THE OPERATOR, AND THE LEDGER HALF IS SETTLED: a
# `docker compose down` followed by `up`, then `fund_desk.py --asset ICP` read
# back `desk 1200.0 LICP` -- the exact balance minted before the down, from the
# same account, through the same ledger canister id. The named volume above does
# what it was added to do, so a `down` does NOT cost the ledger.
#
# STILL NOT MEASURED: whether the tECDSA key survives specifically. The ledger
# surviving is evidence the state directory persisted and nothing more; one
# artifact is not the other. OPEN_FINDINGS finding 19 keeps it open.
#
# THE ONE COMMAND THAT SETTLES THAT HALF, read-only, on a host with the replica up.
#
# IT GOES THROUGH `docker compose exec`, NOT HOST dfx, and that is not a style
# preference. HANDOFF.md section 1: host dfx run with icp/dfx.json in scope saw a
# network directory it had not created, judged it incohesive and moved to DELETE
# icp/.dfx/local -- the replica's state, including the ledger holding the desk's
# LICP. Only a permission error stopped it. `icp-replica` is the COMPOSE SERVICE
# name; the container is `swap-icp-replica` and `docker compose exec` rejects that.
#
#     docker compose exec -T icp-replica dfx canister call threshold_custody public_key '(record { curve = variant { secp256k1_ecdsa }; derivation_path = vec {} })'
#     docker compose down && docker compose up -d
#     docker compose exec -T icp-replica dfx canister call threshold_custody public_key '(record { curve = variant { secp256k1_ecdsa }; derivation_path = vec {} })'
#
# THE ARGUMENT IS A RECORD AND WAS A BARE `(vec {})` until 2026-10-10. Increment
# 1b gave threshold_custody three curves, so the curve is named per call. The old
# form now fails a candid decode -- which is the safe direction, and is also a
# check that reads as a broken replica rather than as a stale command.
#
# Same hex means the key is on the volume and `down` is survivable. A different
# hex means it is not, and any address derived from that key is already
# unreachable. Run it with NOTHING AT A CANISTER-DERIVED ADDRESS.
#
# ---------------------------------------------------------------------------
# HAZARD 2 -- A BARE `docker compose up` IN A FRESH CHECKOUT NOW FAILS, BY DESIGN.
# ---------------------------------------------------------------------------
# docker-compose.web.yml requires SWAP_DB_DIR -- `${SWAP_DB_DIR:?...}` -- because
# a default there would be a compose file choosing which swap database to mount.
# Compose interpolates every variable in every file it reads, includes among them,
# BEFORE it selects a service, so including that file makes SWAP_DB_DIR required
# for every command that reads this one.
#
# THAT IS THE CORRECT BEHAVIOR AND THE GUARD DOES NOT MOVE. The alternative is a
# default, and the two candidates are both wrong: `./runtime/web` would serve an
# EMPTY database that looks exactly like a working one with no swaps in it, and
# the operator's real directory cannot be named by a file in version control. A
# command that stops and names the variable is the only option that cannot
# silently point the terminal at the wrong money.
#
# WHAT WAS DONE ABOUT IT instead of softening it: the error message now names the
# variable, the file it is declared in, and the one check to run first, so the
# failure reads as an instruction rather than as a bug. See that line.
#
# AND THE COST, named rather than discovered: `docker compose -f
# docker-compose.yml -f docker-compose.grc-desk.yml up -d grc-desk` now demands
# SWAP_DB_DIR too, a variable with nothing to do with the Gridcoin desk. That is
# the 2026-10-05 defect this tree learned twice and split eight files over,
# returning through `include:` -- bounded to ONE variable, which
# tests/test_compose_default_project.py pins, so a second one arriving this way
# fails the suite rather than taxing every command.
#
# ---------------------------------------------------------------------------
# HAZARD 3 -- AN OVERLAY ON TOP OF AN INCLUDED SERVICE IS NOT ESTABLISHED HERE.
# ---------------------------------------------------------------------------
# The armed overlays and hostnet override `web`, which now arrives through
# `include:` rather than through a `-f`. Whether compose permits a later `-f` file
# to override a resource an earlier file IMPORTED is a question about compose's own
# merge rules, and it could not be measured from the container this was written in:
# running `docker` there was forbidden, `docker compose config` included.
#
# So no command in this tree passes a file that `include:` already supplies --
# swap_stack.py, chains/icp.py and every printed remedy were reduced to `-f
# docker-compose.yml` in the same change. The overlays are the one path that cannot
# be reduced that way, and each of their headers carries the check to run before an
# armed run. Do not treat this paragraph as a reason to think it works.
# ===========================================================================
include:
  # The ICP half. Brings `icp-replica` and the two named volumes `icp-state` and
  # `icp-replica-data`. No required variable, so including it taxes nothing.
  - docker-compose.icp.yml
  # The Flask UI and the three supervised workers. Brings `web` AND the required
  # SWAP_DB_DIR -- hazard 2 above is this line.
  - docker-compose.web.yml

services:
  abstergo:
    build:
      context: ./swap_terminal/grc-sol-swap/abstergo_exchange
    image: swap-terminal/abstergo:local
    container_name: abstergo

    # OPT-IN, AND THE PROFILE IS NAMED AFTER THE SERVICE ON PURPOSE.
    #
    #     docker compose --profile abstergo up -d abstergo
    #
    # WHY IT IS HERE AT ALL: before 2026-10-10 neither this service nor `harness`
    # carried a profile, so a bare `docker compose up` started both -- an exchange
    # nothing in this stack talks to, and a regtest harness, on a host holding
    # funded testnet wallets. swap_stack.py worked around it by NAMING the two
    # services it wanted (its UP_SERVICES comment records the measurement), which
    # fixed the one command that read that constant and left the literal command
    # an operator types still wrong.
    #
    # WHY THE NAME EQUALS THE SERVICE NAME, rather than something categorical like
    # `optional` or `extras`:
    #
    #   - an operator who knows the service knows the profile. No second
    #     vocabulary to learn, and the two cannot drift apart (rule 8: two names
    #     for one thing agree on the day they are written).
    #   - ONE PROFILE PER SERVICE, which is the same lesson the armed files are
    #     split over. A shared `optional` profile would mean you cannot start the
    #     exchange without also arming a regtest chain, and bundling two decisions
    #     under one token is what docker-compose.web.armed-sol.yml's header
    #     explains at length about keys.
    #   - it reads as what it is on the command line -- `--profile abstergo up -d
    #     abstergo` is redundant and unambiguous, and a MISTYPED profile starts
    #     nothing and says so, rather than starting something else.
    #   - it collides with nothing. `bridge` was the other candidate, and this
    #     file's own `networks:` block at the bottom already uses that word for
    #     the docker bridge it pins -- an overload a reader would have to
    #     disambiguate by context every time, on a token that decides what starts.
    profiles: ["abstergo"]

    # BUILD IT, NEVER TRY TO PULL IT. Without this, `docker compose up` attempts
    # a registry pull of the local tag first and prints, before it builds:
    #
    #     pull access denied for swap-terminal/abstergo, repository does not
    #     exist or may require 'docker login': denied
    #
    # Measured on the operator's host 2026-10-05. The build then succeeded and
    # the message was cosmetic -- which is precisely why it has to go. Rule 14:
    # an operator reading that line cannot tell a cosmetic pull miss from a real
    # failure, and this image is local by construction and has no registry.
    pull_policy: build

    # THE HOST PORT IS NOT 5000 AND THAT IS THE POINT. server.js:80 defaults PORT
    # to 5000; swap_terminal/app.py:78 defaults to 5000 as well, and on the
    # operator's host Flask already owns it. Inside the container there is nothing
    # to collide with, so the container side stays 5000 and only the host side
    # moves. ABSTERGO_HOST_PORT lets that be changed without editing this file.
    # 127.0.0.1 and not 0.0.0.0: this server has no authentication of its own
    # beyond a shared secret on ONE route, and publishing it off-box is a decision
    # nobody has made (design doc §10, decision 4).
    #
    # IT WAS 5001 AND 5001 WAS ALSO TAKEN. Measured on the operator's host
    # 2026-10-05, on the first `docker compose up` this file ever ran:
    #
    #     failed to bind host port 127.0.0.1:5001/tcp: address already in use
    #
    # and `curl http://127.0.0.1:5001/health` answered `404 page not found` --
    # a reply from SOMETHING ELSE already listening there. 5001 was chosen by
    # assuming the next number after a known collision was free, which is the
    # same class of mistake as the collision it was avoiding (rule 17: a reason
    # to believe a port is free is not having checked).
    #
    # 5057 is not special and is not claimed to be free either. It is far from
    # the 5000-5010 band where this already went wrong twice, and it is a
    # DEFAULT, not a requirement: if it collides, export ABSTERGO_HOST_PORT and
    # nothing in this file needs editing. The preflight block in the session
    # notes checks the port before `up` rather than discovering it during.
    ports:
      - "127.0.0.1:${ABSTERGO_HOST_PORT:-5057}:5000"

    environment:
      # FIVE CHECKS THROW AT IMPORT, BEFORE app.listen -- server.js:99-103. All
      # five are listed here, because the first draft of this file listed only
      # the Gridcoin RPC one and the container would have refused to start on
      # VITE_API_URL with nothing in this file explaining why:
      #
      #     99   DEVNET_RPC_URL
      #     100  VITE_API_URL
      #     101  GRIDCOIN_DEPOSIT_ADDRESS or EXCHANGE_WALLET_ADDRESS
      #     102  GRIDCOIN_RPC_URL or GRIDCOIN_RPC_HOST + GRIDCOIN_RPC_PORT
      #     103  GRIDCOIN_RPC_USER and GRIDCOIN_RPC_PASSWORD
      #
      # Fail-closed startup is the behavior we want in a container: a
      # misconfigured service must not reach "running". It does mean the first
      # `docker compose up` on a shell that has not exported these exits
      # immediately, and the message in `docker compose logs abstergo` names the
      # variable. That is the design working, not a bug.
      #
      # OBSERVED EXACTLY THAT, 2026-10-05, on the first run of this file:
      #
      #     abstergo | Error: DEVNET_RPC_URL is required
      #     abstergo |     at file:///app/server.js:99:28
      #
      # DEVNET_RPC_URL is the FIRST of the five, so it is the one a cold shell
      # hits; the other four are behind it and will surface one at a time as each
      # is supplied. `docker compose logs abstergo` is where the name appears --
      # `docker compose ps` only shows the exit.
      #
      # NO DEFAULTS ON ANY CREDENTIAL OR ENDPOINT. `${NAME:-}` is an empty string
      # when unset, which the checks above refuse. A default here would be this
      # file choosing a credential or an endpoint nobody picked -- the same
      # objection collect_fees.py makes about a defaulted fee-sweep address.
      DEVNET_RPC_URL: "${DEVNET_RPC_URL:-}"
      VITE_API_URL: "${VITE_API_URL:-}"
      GRIDCOIN_DEPOSIT_ADDRESS: "${GRIDCOIN_DEPOSIT_ADDRESS:-}"
      # server.js:77 accepts either spelling. Both are passed through so an
      # operator whose shell already exports the older name does not have to
      # learn that this file renamed it.
      EXCHANGE_WALLET_ADDRESS: "${EXCHANGE_WALLET_ADDRESS:-}"
      GRIDCOIN_RPC_URL: "${GRIDCOIN_RPC_URL:-}"
      GRIDCOIN_RPC_HOST: "${GRIDCOIN_RPC_HOST:-}"
      GRIDCOIN_RPC_PORT: "${GRIDCOIN_RPC_PORT:-}"
      GRIDCOIN_RPC_USER: "${GRIDCOIN_RPC_USER:-}"
      GRIDCOIN_RPC_PASSWORD: "${GRIDCOIN_RPC_PASSWORD:-}"
      # server.js:94-97 falls back to these three bare names. Passed through for
      # the same reason as EXCHANGE_WALLET_ADDRESS, and listed rather than
      # omitted so a reader can see the whole set the server will actually read.
      RPC_URL: "${RPC_URL:-}"
      RPC_USER: "${RPC_USER:-}"
      RPC_PASS: "${RPC_PASS:-}"

      GRIDCOIN_VERIFY_SHARED_SECRET: "${GRIDCOIN_VERIFY_SHARED_SECRET:-}"
      # Defaulted to true ON PURPOSE, and it is the one default in this block.
      # auth.js:199 makes a missing secret FATAL while this is on; turning it off
      # leaves POST /verify-gridcoin -- the step that marks an intent releasable
      # -- unauthenticated. The safe value is the one that refuses to start.
      REQUIRE_GRIDCOIN_SHARED_SECRET: "${REQUIRE_GRIDCOIN_SHARED_SECRET:-true}"

      # 6 is not invented here. server.js:88 defaults to 6 and config.py:153's
      # GRC_MIN_CONFIRMATIONS defaults to 6, so this file repeats a value the
      # tree already agrees on in two places rather than introducing a third
      # opinion -- which is what it would be if it said anything else.
      GRIDCOIN_MIN_CONFIRMATIONS: "${GRIDCOIN_MIN_CONFIRMATIONS:-6}"
      SOLANA_HOT_WALLET_PUBLIC_KEY: "${SOLANA_HOT_WALLET_PUBLIC_KEY:-}"
      # Tuning knobs with in-code defaults (server.js:82, :87). Passed through so
      # they can be changed without a rebuild; unset means the server's own value.
      PRICE_CACHE_TTL_MS: "${PRICE_CACHE_TTL_MS:-}"
      SWAP_INTENT_TTL_MS: "${SWAP_INTENT_TTL_MS:-}"

      # SOLANA_PAYER_KEYPAIR_PATH IS DELIBERATELY ABSENT, and its absence is a
      # posture, not an oversight. Unset, server.js:143 loads no payer and :696
      # answers /execute with "Swap execution is disabled until
      # SOLANA_PAYER_KEYPAIR_PATH is configured" -- the SOL payout leg is off.
      # Arming it means mounting a private key into this container, which is a
      # live-posture change and the operator's call (CLAUDE.md rule 16), not a
      # line this file gets to write on their behalf. No key is read, copied or
      # mounted by this change.

      # The path INSIDE the container. The host side is the volume below.
      SWAP_INTENTS_PATH: /data/swap_intents.json
      PORT: "5000"

    volumes:
      # THE FUND-RELEASING FILE, ON A HOST PATH, AND THIS IS THE LOAD-BEARING LINE.
      # swap_intents.json decides whether a release happens and has no connection
      # to swap_terminal.db -- two systems of record with nothing reconciling them
      # (design doc §12). On the container's writable layer it would die with the
      # container; in the image it would be a stale snapshot. Neither is survivable
      # for a file that decides money.
      #
      # The host directory must be writable by uid 1000, because the image runs as
      # the non-root `node` user. The verification block below checks that before
      # anything is started.
      - "${ABSTERGO_STATE_DIR:-./runtime/abstergo}:/data"

    # `on-failure` WITH A CAP, AND NOT `unless-stopped`. THIS COMMENT USED TO SAY
    # THE OPPOSITE AND WAS REFUTED BY THE FIRST RUN.
    #
    # It read: "NOT `always`. A server that cannot start because a credential is
    # missing should STAY DOWN and be visible as down, not restart-loop while
    # `docker compose ps` shows it flapping. unless-stopped restarts it across a
    # host reboot and honors a deliberate `docker compose stop`."
    #
    # The INTENT was right and the setting does not deliver it. Measured on the
    # operator's host 2026-10-05, first `docker compose up -d abstergo`, with
    # DEVNET_RPC_URL unset so server.js:99 threw at import:
    #
    #     STATUS: Restarting (1) Less than a second ago
    #
    # `unless-stopped` restart-loops a crash exactly as hard as `always` does. The
    # difference between them is only what happens after a deliberate stop and a
    # host reboot, not what happens to a container that exits non-zero.
    #
    # `on-failure` with max-retries is the setting that actually does what the
    # paragraph above wanted: a few attempts for a genuinely transient failure,
    # then it gives up and sits there as `Exited (1)` where an operator can see it
    # and `docker compose logs` still has the reason. A fail-closed startup check
    # is worth nothing if the container hides it by restarting forever.
    restart: on-failure:3

    # This is the reaper, and naming it here is rule 13's first bullet: a spawn and
    # its reap are one change. `docker compose stop` sends SIGTERM, dumb-init
    # forwards it, node exits. The 20s is generous for a server with no long
    # operation; if it is ever hit, that is a finding rather than a tuning problem.
    stop_grace_period: 20s

  # ---------------------------------------------------------------------------
  # INCREMENT 2 -- the regtest harness. Lowest stakes in the file: regtest coins
  # have no value, and regtest/daemons.assert_regtest() is unconditional.
  # ---------------------------------------------------------------------------
  harness:
    build:
      context: .
      dockerfile: docker/harness.Dockerfile
    image: swap-terminal/harness:local
    container_name: swap-harness
    pull_policy: build

    # OPT-IN, AND THIS IS THE ONE THE PROFILE MATTERS MOST FOR.
    #
    #     docker compose --profile harness up -d harness
    #
    # A bare `docker compose up` started this container until 2026-10-10. It brings
    # up regtest bitcoind and litecoind on a host whose other daemons hold funded
    # testnet wallets, and the only thing that made that harmless was that
    # regtest/daemons.assert_regtest() is unconditional and the datadirs are its
    # own. "Harmless by a check elsewhere" is not the same as "not started", and a
    # test harness that comes up because of a filename is rule 13's unreaped spawn
    # one step earlier: nobody asked for it, so nobody is watching it.
    #
    # Named after the service for the reasons spelled out on `abstergo` above.
    profiles: ["harness"]

    # NO PORTS PUBLISHED, and that is the design doc's own recommendation: the
    # harness lives in this container, so it reaches both daemons over the
    # container's loopback and publishing 18443/19443 buys nothing. Add
    # `ports:` only if a host tool needs to reach them, and know that you are
    # widening the surface to do it.

    environment:
      # These are the names regtest/daemons.py reads. The DATADIRs are also set in
      # the image, and repeated here because this file is where a reader looks.
      ST_REGTEST_BTC_DATADIR: /data/btc
      ST_REGTEST_LTC_DATADIR: /data/ltc
      ST_REGTEST_RPC_HOST: "127.0.0.1"
      ST_REGTEST_BTC_RPC_USER: "${ST_REGTEST_BTC_RPC_USER:-}"
      ST_REGTEST_BTC_RPC_PASSWORD: "${ST_REGTEST_BTC_RPC_PASSWORD:-}"
      ST_REGTEST_LTC_RPC_USER: "${ST_REGTEST_LTC_RPC_USER:-}"
      ST_REGTEST_LTC_RPC_PASSWORD: "${ST_REGTEST_LTC_RPC_PASSWORD:-}"
      # ST_ADAPTOR_FUNDING_SEED IS DELIBERATELY ABSENT. It arms a funding step, it
      # must never be a command-line argument (argv is world-readable through
      # /proc), and arming is the operator's decision (rule 16). Pass it with
      # `docker compose run --env` for the one invocation that needs it, rather
      # than leaving it on a long-lived service definition.

    volumes:
      - "${ST_REGTEST_STATE_DIR:-./runtime/regtest}:/data"

    # NOT "unless-stopped". A regtest harness that restarts itself across a reboot
    # is a chain nobody asked to keep. It is started for a verification run and
    # stopped after.
    restart: "no"

    # 60s because regtest/daemons.STOP_TIMEOUT_SECONDS defaults to 60 and the inner
    # reaper polls for absence up to that long. A grace period shorter than the
    # reaper's own timeout would SIGKILL the harness mid-proof, which turns a
    # provable stop into an unprovable one by configuration.
    stop_grace_period: 65s


# ---------------------------------------------------------------------------
# THE BRIDGE, PINNED. Added 2026-10-10 at the operator's instruction.
#
# WHAT WAS WRONG: there was no `networks:` block in any of the three -f files, so
# compose created `<project>_default` and DOCKER CHOSE THE SUBNET from its pool.
# The operator's firewall has a rule that names `172.18.0.0/16` by hand -- the
# rule that lets this bridge reach the chain daemons' RPC on the host. Two copies
# of one fact, in two systems that cannot see each other, agreeing on the day they
# were written. That is rule 8's defect with a delay on it, and the delay here is
# "the next time docker assigns a different /16".
#
# HOW IT FAILS IS THE PART THAT MAKES IT WORTH PINNING. A subnet reassignment does
# not error. The firewall rule simply stops matching, and the symptom is every
# chain reading NOT CONFIGURED in a container whose environment is perfectly
# correct -- which is a diagnosis this session has already paid for once, from the
# other direction (a host gunicorn that reads no .env, C45). Rule 13's "verify the
# artifact, not the deploy" applies to a network as much as to a view.
#
# THE DEFAULT IS THE VALUE THE FIREWALL RULE ALREADY NAMES, deliberately: pinning
# it to anything else would silently require the operator to edit ufw, and a change
# that needs a second change somewhere else to stay correct is the thing this block
# exists to remove. Overridable for a host where 172.18/16 is taken.
#
# WHAT THIS DOES NOT FIX, said rather than implied: every service in these files
# shares this one bridge -- abstergo, harness, icp-replica and web -- so a rule
# that admits the subnet admits all four, which is OPEN_FINDINGS finding 4 and is
# not addressed by pinning the address. A /16 is also 65,534 addresses for four
# containers; narrowing it is a follow-up that requires a ufw edit in the same
# change, which is why it is not done here unasked.
#
# VERIFY IT RATHER THAN TRUST IT: `swap_stack.py status` reads the live subnet back
# out of docker and prints it beside this declared value, because a pin nobody
# reads back is the same defect as a deploy nobody verifies.
#
# AND SINCE 2026-10-10 THAT READ-BACK IS CARRYING MORE WEIGHT THAN IT WAS WRITTEN
# FOR. `web` and `icp-replica` used to arrive through `-f`, where this block and
# their service definitions were merged by one mechanism. They now arrive through
# `include:`, and neither of their files declares a `networks:` key -- so whether
# the included services attach to THIS `default` definition, with its ipam, or to a
# `default` compose derives separately, is a question about compose's own include
# semantics that was NOT measured where this change was made. The reasonable
# expectation is that they attach to it; expecting is not reading (rule 17).
#
# IT IS THE CHEAPEST OF THE UNKNOWNS TO CHECK, because the mechanism already exists
# and nobody has to remember to use it: `swap_stack.py status` prints
#
#     bridge subnet     is the compose network on 172.18.0.0/16, ...
#
# with the LIVE value read out of docker, and says `drifted` rather than `matches`
# when they differ. If that line ever reads `drifted` on a stack started by a bare
# `docker compose up`, this is the paragraph to come back to -- the symptom would
# otherwise be every chain reading NOT CONFIGURED in a container whose environment
# is perfectly correct.
networks:
  default:
    ipam:
      config:
        - subnet: "${SWAP_TERMINAL_BRIDGE_SUBNET:-172.18.0.0/16}"
